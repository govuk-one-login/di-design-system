<!DOCTYPE html>
<html lang="en" class="govuk-template govuk-template--rebranded">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toggle to Welsh example</title>
    <link rel="stylesheet" href="/assets/application.css">
    <link rel="stylesheet" href="/assets/app-restyle.css">
    <link rel="stylesheet" href="/assets/frontend-ui.css">
  </head>
  <body class="govuk-template__body">
    <div class="govuk-width-container">
      <main class="govuk-main-wrapper" id="main-content">
        


<nav
  class="language-select "
  aria-label="Language switcher"
  role="navigation"
>
  <ul
    class="govuk-list language-select__list govuk-body-s govuk-!-margin-0"
    role="list"
  >
    <li class="language-select__list-item" role="listitem">
      <span aria-current="true">English</span>
    </li>
    <li class="language-select__list-item" role="listitem">
      <a
        class="govuk-link govuk-link--no-visited-state"
        href="/toggle-to-welsh/example/?lng=cy"
        data-journey-click="link - click:lang-select:cy"
        rel="alternate"
        hreflang="cy"
        lang="cy"
        role="link"
      >Cymraeg<div class="govuk-visually-hidden">Newid yr iaith ir Gymraeg</div></a>
    </li>
  </ul>
</nav>


      </main>
    </div>
    <script type="module" src="/assets/application.js"></script>
    <script type="module" src="/assets/frontend-ui.js"></script>
  </body>
</html>
